name: CI

# A branch push and its pull request are two separate events, and running on
# both ran the whole suite twice for one commit: e.g. runs 107 (push) and 108
# (pull_request) on the same SHA, a minute apart, ~10 minutes of end-to-end each.
# The concurrency group below cannot collapse them, because a push is
# `refs/heads/<branch>` while its pull request is `refs/pull/<n>/merge`.
#
# Branch work is covered by the pull_request event, which is the better of the
# two anyway: it tests the merge commit, so it catches a conflict with main that
# a branch-head run would miss. main keeps a direct run of its own after merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # CI installs WebKit as well, so the iphone-13 and ipad projects run on
      # the real engine there even though the development sandbox cannot
      # download it and falls back to Chromium emulation.
      - run: npx playwright install --with-deps chromium webkit

      - run: npm run test:e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
