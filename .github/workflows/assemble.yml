name: Assemble production source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble source files
        run: |
          cat .build/app.aa .build/app.ab .build/app.ac .build/app.ad > src/app.js
          cat .build/css.aa .build/css.ab .build/css.ac > styles.css
      - name: Validate
        run: |
          npm test
          npm run check
      - name: Finalize clean production tree
        run: |
          rm -rf .build .github/workflows/assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize production source"
          git push
