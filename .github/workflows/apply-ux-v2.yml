name: Apply UX v2

on:
  push:
    branches:
      - ux-v2-staging

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-v2-staging
          fetch-depth: 0
      - name: Apply UX v2 patches
        run: |
          cat .build/app.* > /tmp/app.patch
          cat .build/css.* > /tmp/css.patch
          git apply /tmp/app.patch /tmp/css.patch .build/small.patch
          cp .build/ux-contract.test.mjs tests/ux-contract.test.mjs
      - name: Validate
        run: |
          npm test
          npm run check
      - name: Finalize source
        run: |
          rm -rf .build
          rm -f .github/workflows/apply-ux-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish planner UI and timeline UX"
          git push origin HEAD:main
